services:
  postgres:
    image: postgres:17-alpine
    container_name: document-ia-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # ggignore
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - document-ia-prod-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-document_ia}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: document-ia-prod-redis
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - document-ia-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: coollabsio/minio:latest
    container_name: document-ia-prod-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
    volumes:
      - minio_prod_data:/data
    networks:
      - document-ia-prod-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  init-s3-bucket:
    image: coollabsio/minio:latest
    container_name: document-ia-prod-init-s3-bucket
    restart: "no"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-document-ia}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local "$$S3_ENDPOINT_URL" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
    networks:
      - document-ia-prod-network
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: document-ia-api/Dockerfile
    container_name: document-ia-prod-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DOCUMENT_IA_API_KEY: ${DOCUMENT_IA_API_KEY:?DOCUMENT_IA_API_KEY must be set in environment or root .env}
      API_KEY_PEPPER_HASH: ${API_KEY_PEPPER_HASH:-default_pepper_hash_value}  # ggignore
      API_KEY_PEPPER_CHK: ${API_KEY_PEPPER_CHK:-default_pepper_chk_value}  # ggignore
      POSTGRES_DB: ${POSTGRES_DB:-document_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # ggignore
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL_MODE: disable
      POSTGRESQL_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_URL: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-document-ia}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: "false"
      LOKI_LOGGING_ENABLED: "false"
      # Optional at boot; required only if encrypting/decrypting webhook headers
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
    networks:
      - document-ia-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-s3-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: document-ia-worker/Dockerfile
      target: worker
    container_name: document-ia-prod-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      TESSERACT_LANG: fra
      POSTGRES_DB: ${POSTGRES_DB:-document_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # ggignore
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL_MODE: disable
      POSTGRESQL_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_URL: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-document-ia}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: "false"
      LOKI_LOGGING_ENABLED: "false"
      # Optional at boot; required only if encrypting/decrypting webhook headers
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    networks:
      - document-ia-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-s3-bucket:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib, sys; sys.exit(0 if 'document_ia_worker/main.py' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8', 'ignore') else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  evals:
    profiles: ["full"]
    build:
      context: .
      dockerfile: document-ia-evals/Dockerfile
    container_name: document-ia-prod-evals
    restart: unless-stopped
    ports:
      - "${EVALS_PORT:-8501}:8501"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DOCUMENT_IA_API_KEY: ${DOCUMENT_IA_API_KEY:?DOCUMENT_IA_API_KEY must be set in environment or root .env}
      POSTGRES_DB: ${POSTGRES_DB:-document_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # ggignore
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL_MODE: disable
      POSTGRESQL_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_URL: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-document-ia}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: "false"
      LOKI_LOGGING_ENABLED: "false"
      PROCONNECT_CLIENT_ID: ${PROCONNECT_CLIENT_ID:-local-evals-client}
      PROCONNECT_CLIENT_SECRET: ${PROCONNECT_CLIENT_SECRET:-local-evals-secret}  # ggignore
    networks:
      - document-ia-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-s3-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  remove-ppi:
    profiles: ["full"]
    build:
      context: .
      dockerfile: document-ia-worker/Dockerfile
      target: remove_ppi
    container_name: document-ia-prod-remove-ppi
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_DB: ${POSTGRES_DB:-document_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # ggignore
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL_MODE: disable
      POSTGRESQL_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_URL: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-document-ia}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: "false"
      LOKI_LOGGING_ENABLED: "false"
    networks:
      - document-ia-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-s3-bucket:
        condition: service_completed_successfully

  replicate-analytics:
    profiles: ["full"]
    build:
      context: .
      dockerfile: document-ia-worker/Dockerfile
      target: replicate_analytics
    container_name: document-ia-prod-replicate-analytics
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_DB: ${POSTGRES_DB:-document_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # ggignore
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL_MODE: disable
      POSTGRESQL_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_URL: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}  # ggignore
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-document-ia}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: "false"
      LOKI_LOGGING_ENABLED: "false"
    networks:
      - document-ia-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-s3-bucket:
        condition: service_completed_successfully

  auto-scaler:
    profiles: ["full"]
    build:
      context: .
      dockerfile: document-ia-auto-scaler/Dockerfile
    container_name: document-ia-prod-auto-scaler
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_URL: ""
      LOKI_LOGGING_ENABLED: "false"
    networks:
      - document-ia-prod-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  document-ia-prod-network:
    driver: bridge
