[project]
name = "document-ia-infra"
version = "1.1.1"
description = "Code des briques d'infrastructure pour Document IA"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv == 1.2.4",
    "redis == 8.1.0",
    "boto3 == 1.43.126",
    "pydantic == 2.14.3",
    "pydantic-settings == 2.16.2",
    "openai==3.46.0",
    "httpx == 0.28.1",
    "tiktoken == 0.14.0",
    "sqlalchemy == 2.1.8",
    "asyncpg == 0.32.0",
    "mypy-boto3-s3 == 1.43.106",
    "python-logging-loki == 0.3.1",
    "document-ia-schemas",
    "2ddoc-parser",
    "cryptography == 50.0.2",
    "psycopg2-binary == 2.9.13",
    "pyyaml == 6.0.3",
    "greenlet == 3.5.6",
    "botocore == 1.43.126",
    "requests == 2.34.2",
    "httpcore == 1.0.9",
    "pydantic-core == 2.50.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.17.4",
    "pytest == 9.2.0",
    "pytest-asyncio == 1.4.1.post1",
    "pre-commit == 4.7.0",
    "pyright == 1.1.414",
]

[tool.uv.sources.document-ia-schemas]
workspace = true

[tool.uv.sources.2ddoc-parser]
git = "https://github.com/betagouv/2ddoc-parser.git"
tag = "v1.0.8"

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_infra"]

[tool.ruff]
target-version = "py314"
line-length = 88

# TODO: Dans une PR complémentaire, durcir le linter et revenir aux règles par défaut de Ruff
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
