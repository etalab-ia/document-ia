[project]
name = "document-ia-worker"
version = "1.1.1"
description = "Worker document ia"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "document-ia-infra",
    "document-ia-schemas",
    "python-dotenv == 1.2.4",
    "pydantic-settings == 2.16.2",
    "pytesseract == 0.3.13",
    "pymupdf==2.1",
    "opencv-python-headless == 5.0.0.93",
    "jinja2 == 3.1.6",
    "pydantic == 2.14.3",
    "mypy-boto3-s3 == 1.43.106",
    "greenlet == 3.5.6",
    "httpx == 0.28.1",
    "zxing-cpp == 3.1.1",
    "2ddoc-parser",
    "python-magic == 0.4.27",
    "psycopg2-binary == 2.9.13",
    "torch == 2.15.0+cpu; sys_platform == 'linux'",
    "torch == 2.15.0; sys_platform == 'darwin'",
    "torchvision == 0.29.2+cpu; sys_platform == 'linux'",
    "torchvision == 0.29.2; sys_platform == 'darwin'",
    "qrdet == 2.5",
    "clip",
    "ultralytics == 8.4.91",
    "pillow == 13.0.0",
    "numpy == 2.5.1",
    "sqlalchemy == 2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.17.4",
    "pytest == 9.2.0",
    "pytest-asyncio == 1.4.1.post1",
    "pre-commit == 4.7.0",
    "uvicorn == 0.54.0",
    "pyright == 1.1.414",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "c4b6ea0932a2c0f39a0fa528af5ec4982ff15cab" }

[tool.uv.sources.document-ia-infra]
workspace = true

[tool.uv.sources.document-ia-schemas]
workspace = true

[tool.uv.sources.2ddoc-parser]
git = "https://github.com/betagouv/2ddoc-parser.git"
tag = "v1.0.8"

[[tool.uv.sources.torch]]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[[tool.uv.sources.torchvision]]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_worker", "src/document_ia_task_scheduler"]

[tool.ruff]
target-version = "py314"
line-length = 88

# TODO: Dans une PR complémentaire, durcir le linter et revenir aux règles par défaut de Ruff
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
